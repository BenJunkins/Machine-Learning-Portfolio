name: Spam filter

# Run when the spam filter or this file changes, and on demand from the Actions tab
on:
  push:
    branches: [main]
    paths:
      - "projects/spam-filter/**"
      - ".github/workflows/spam-filter.yml"
  pull_request:
    paths:
      - "projects/spam-filter/**"
      - ".github/workflows/spam-filter.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every "run" step below starts in the project folder
defaults:
  run:
    working-directory: projects/spam-filter

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/spam-filter/requirements-*.txt

      - name: Install requirements
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  docker:
    name: Build and call the image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t spam-filter-api .

      - name: Start a container
        run: docker run -d --name api -p 127.0.0.1:8000:8000 spam-filter-api

      - name: Wait for it to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Score an email
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"email": "Congratulations! You have been selected to receive a FREE $1000 gift card. Click here to claim your prize: http://www.example.com/claim"}' \
            | tee response.json
          grep -q '"label":"spam"' response.json

      - name: Stop the container
        if: always()
        run: docker rm -f api

  publish:
    name: Publish the image
    runs-on: ubuntu-latest
    needs: docker
    # Only for changes that have landed on main, never for a pull request
    if: github.ref == 'refs/heads/main'
    # This job alone may write to the container registry
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/benjunkins/spam-filter-api
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub container registry
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" .

      - name: Push it
        run: docker push --all-tags "$IMAGE"
